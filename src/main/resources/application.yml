server:
  # Railway injects PORT; fall back to 8080 locally.
  port: ${PORT:8080}
  # Railway terminates TLS at its proxy. Trust X-Forwarded-* headers so that
  # generated redirect URIs use https://<your-app>.up.railway.app.
  forward-headers-strategy: framework

spring:
  application:
    name: authexample
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope: openid, profile, email
        provider:
          auth0:
            # e.g. AUTH0_DOMAIN=dev-abc123.us.auth0.com
            # The trailing slash matters: it must match the "iss" claim in Auth0 tokens.
            issuer-uri: https://${AUTH0_DOMAIN}/

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth0:
    # Custom ID-token claim that the Auth0 Post-Login Action fills with the user's roles.
    # Must match the namespace in auth0/add-roles-to-tokens.js.
    roles-claim: ${AUTH0_ROLES_CLAIM:https://authexample.demo/roles}
    domain: ${AUTH0_DOMAIN}
    # Machine-to-Machine app authorized for the Auth0 Management API. Used by the
    # admin "Users" page. Optional: the page explains how to set it up if missing.
    management:
      client-id: ${AUTH0_MGMT_CLIENT_ID:}
      client-secret: ${AUTH0_MGMT_CLIENT_SECRET:}
